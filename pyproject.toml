[project]
name = "agentic-research-assistant"
version = "0.1.0"
description = "An agentic system for discovering research papers and answering questions with retrieved academic sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5",
    "arxiv==2.2.0",
    "docling==2.52.0",
    "fastapi[standard]>=0.139.2",
    "gradio==5.45.0",
    "httpx>=0.28.1",
    "langfuse==3.9.0",
    "opensearch-py>=3.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "httpx2>=2.8.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.uv]
constraint-dependencies = [
    "docling-core==2.48.1",
    "docling-ibm-models==3.9.1",
    "docling-parse==4.4.0",
    "opencv-python-headless==4.11.0.86",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",  # Import-related style errors
    "E7",  # Statement-related style errors
    "E9",  # Runtime and syntax errors
    "F",   # Pyflakes checks
    "I",   # Import sorting
    "UP",  # Modern Python syntax
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
