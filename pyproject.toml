[project]
name = "agentic-research-assistant"
version = "0.1.0"
description = "An agentic system for discovering research papers and answering questions with retrieved academic sources."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "httpx2>=2.8.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",  # Import-related style errors
    "E7",  # Statement-related style errors
    "E9",  # Runtime and syntax errors
    "F",   # Pyflakes checks
    "I",   # Import sorting
    "UP",  # Modern Python syntax
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
